title: Person Fit
name: personfit
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Items
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true

  - type: Label
    label: Statistics
    children:
      - type: CheckBox
        name: statInfit
      - type: CheckBox
        name: statOutfit
      - type: CheckBox
        name: statLz

  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: flagDirection
      - type: TextBox
        name: flagAlpha
        format: number
      - type: TextBox
        name: iterations
        format: number
      - type: TextBox
        name: seed
        format: number

  - type: CollapseBox
    label: Save to Dataset
    collapsed: false
    children:
      - type: Output
        name: outputFlagged
      - type: Output
        name: outputInfit
      - type: Output
        name: outputOutfit
      - type: Output
        name: outputLz
      - type: Output
        name: outputPInfit
      - type: Output
        name: outputPOutfit
      - type: Output
        name: outputPLz
