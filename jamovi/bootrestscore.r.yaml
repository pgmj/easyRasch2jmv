---
name: bootrestscore
title: Bootstrap Item-Restscore
jrs: '1.1'

items:
    - name: bootstrapTable
      title: Bootstrap Item-Restscore Misfit
      type: Table
      rows: (vars)
      refs: [easyRasch2jmv, easyRasch2, kreiner2011, mueller2022, zeileis2026, warm1989, johansson2025_detecting]
      clearWith:
          - vars
          - iterations
          - samplesize
          - seed
          - cutoff
          - sortBy
      columns:
          - name: item
            title: Item
            type: text
          - name: pctOverfit
            title: '% Overfit'
            type: number
            format: zto
          - name: pctUnderfit
            title: '% Underfit'
            type: number
            format: zto
          - name: relLocation
            title: Rel. location
            type: number
            format: zto
          - name: misfit
            title: Flagged
            type: text

    # Hidden state carrier: caches the bootstrap (raw per-iteration data +
    # the full-sample restscore fit) so option changes that do not affect
    # it (cutoff, sortBy, showPlot) reuse the resampling results instead of
    # rerunning them. The violin plot reads the raw data from here too.
    # Never displayed.
    - name: simCache
      title: ''
      type: Html
      visible: false
      clearWith:
          - vars
          - iterations
          - samplesize
          - seed

    - name: bootstrapNote
      title: ''
      type: Html
      clearWith:
          - vars
          - iterations
          - samplesize
          - seed

    - name: bootstrapPlot
      title: Bootstrap Item-Restscore Differences
      type: Image
      width: 500
      height: 600
      renderFun: .bootstrapPlot
      visible: (showPlot)
      clearWith:
          - vars
          - iterations
          - samplesize
          - seed
          - sortBy

...
