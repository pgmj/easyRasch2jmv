---
title: Targeting Plot
name: targeting
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Items
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true

  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: robust
      - type: ComboBox
        name: sortItems
      - type: TextBox
        name: bins
        format: number

  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: xlimLow
        format: number
      - type: TextBox
        name: xlimHigh
        format: number

  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: longFormat
      - type: CheckBox
        name: showCi
      - type: TextBox
        name: ciLevel
        format: number

  - type: CollapseBox
    label: Bottom Panel
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: panel
          - type: CheckBox
            name: categoryLabels
          - type: TextBox
            name: rowGap
            format: number
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: viridisOption
          - type: TextBox
            name: viridisBegin
            format: number
          - type: TextBox
            name: viridisEnd
            format: number
...
