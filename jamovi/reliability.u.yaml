title: Reliability
name: reliability
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Items
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true

  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: estim
      - type: TextBox
        name: confInt
        format: number
        suffix: "%"
      - type: TextBox
        name: draws
        format: number
      - type: TextBox
        name: rmuIter
        format: number

  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: thetaMin
        format: number
      - type: TextBox
        name: thetaMax
        format: number
      - type: TextBox
        name: seed
        format: number

  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: bootAlpha
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: TextBox
                name: bootIter
                format: number

  # The curve is a headline result, not an estimation detail, so it sits in
  # the main panel and its sub-options nest under the checkbox in the same
  # way the bootstrap iterations nest under Bootstrap CIs above.
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: showCurve
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: curveStatistic
              - type: CheckBox
                name: curveReference
              - type: CheckBox
                name: showDensity
              - type: CheckBox
                name: useBenchmark
                children:
                  - type: TextBox
                    name: benchmark
                    format: number
              - type: CheckBox
                name: curveBoot
                children:
                  - type: LayoutBox
                    margin: large
                    children:
                      - type: TextBox
                        name: curveBootIter
                        format: number
              - type: TextBox
                name: nNodes
                format: number
