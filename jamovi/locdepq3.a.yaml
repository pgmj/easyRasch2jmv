---
name: locdepq3
title: Q3 Residual Correlation Matrix
menuGroup: easyRasch2jmv
version: '1.0.0'
jas: '1.2'

description:
    main: |
        Computes Yen's Q3 residual correlations between item pairs for local
        dependence assessment in Rasch models, using the easyRasch2 R package:
        item parameters are estimated by conditional maximum likelihood (CML,
        via psychotools) and person locations by Warm's weighted likelihood
        (WLE). Optionally runs a parametric bootstrap simulation to determine
        simulation-based cutoff values -- a global cutoff applied to the Q3
        matrix and per-pair expected ranges -- along with a Q3 heatmap and a
        per-pair distribution plot. Results match easyRasch2::RMlocdepQ3(),
        RMlocdepQ3Cutoff(), and RMlocdepQ3Plot() with the same seed and
        iterations. Single-core sequential processing is used.

        Optionally, bootstrap p-values can be added to the item-pair
        table: each pair's observed Q3 is compared against its simulated
        distribution (one-sided Monte-Carlo p-value for excess positive
        local dependence), with correction for multiple comparisons
        across all pairs -- Westfall-Young step-down (familywise error
        rate, the default; Ferreira, 2024), Benjamini-Hochberg, or
        Benjamini-Yekutieli (false discovery rate). Flagging is then
        based on the adjusted p-value (< 0.05) instead of the expected
        range. At least 1000 iterations are recommended when reporting
        p-values. Results match easyRasch2::RMlocdepQ3() with
        p_value = TRUE.

options:
    - name: data
      type: Data

    - name: vars
      title: Items
      type: Variables
      suggested:
          - continuous
          - ordinal
      permitted:
          - numeric
      rejectInf: true

    - name: computeCutoff
      title: Simulation-based cutoff
      type: Bool
      default: false

    - name: iterations
      title: Number of simulation iterations
      type: Integer
      default: 400
      min: 50
      max: 5000

    - name: hdciWidth
      title: HDCI width for item-pair intervals
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: seed
      title: Random seed
      type: Integer
      default: 42
      min: 0

    - name: pValues
      title: Bootstrap p-values
      type: Bool
      default: true

    - name: correction
      title: Multiple-comparison correction
      type: List
      options:
        - name: fwer
          title: Familywise (Westfall-Young)
        - name: fdr_bh
          title: FDR (Benjamini-Hochberg)
        - name: fdr_by
          title: FDR (Benjamini-Yekutieli)
      default: fwer

    - name: nPairs
      title: Max. number of item pairs to plot
      type: Integer
      default: 10
      min: 1
      max: 50

...
