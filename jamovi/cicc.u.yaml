---
title: Item Characteristic Curves (CICC)
name: cicc
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Items
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: DIF Variable (optional)
        children:
          - type: VariablesListBox
            name: difVar
            maxItemCount: 1
            isTarget: true

  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: method
      - type: TextBox
        name: classIntervals
        format: number
        enable: (method:quantile || method:width)
      - type: CheckBox
        name: ci
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: errorBand
              - type: TextBox
                name: confLevel
                format: number
      - type: TextBox
        name: minN
        format: number
...
