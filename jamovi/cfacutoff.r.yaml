---
name: cfacutoff
title: Dynamic CFA Fit-Index Cutoffs
jrs: '1.1'

items:
    - name: cfaTable
      title: Observed CFA Fit vs Simulated Cutoff
      type: Table
      rows: 3
      refs: [easyRasch2jmv, easyRasch2, zeileis2026, warm1989]
      clearWith:
          - vars
          - estimator
          - percentile
          - iterations
          - seed
      columns:
          - name: index
            title: Index
            type: text
          - name: observed
            title: Observed
            type: number
            format: zto
          - name: cutoff
            title: Cutoff
            type: number
            format: zto
          - name: flagged
            title: Flagged
            type: text

    - name: loadingsTable
      title: Standardized Loadings vs Simulated Expected Range
      type: Table
      rows: 0
      clearWith:
          - vars
          - estimator
          - percentile
          - iterations
          - seed
      columns:
          - name: item
            title: Item
            type: text
          - name: observed
            title: Observed loading
            type: number
            format: zto
          - name: low
            title: Lower
            type: number
            format: zto
            superTitle: Expected range
          - name: high
            title: Upper
            type: number
            format: zto
            superTitle: Expected range
          - name: flagged
            title: Flagged
            type: text

    - name: cfaNote
      title: ''
      type: Html
      clearWith:
          - vars
          - estimator
          - percentile
          - iterations
          - seed

    - name: cfaPlot
      title: Observed CFA Fit vs Simulated Null Distribution
      type: Image
      width: 700
      height: 350
      renderFun: .cfaPlot
      requiresData: true
      clearWith:
          - vars
          - estimator
          - percentile
          - iterations
          - seed

    - name: cfaLoadingsPlot
      title: Standardized Loadings vs Simulated Expected Range
      type: Image
      width: 600
      height: 500
      renderFun: .cfaLoadingsPlot
      requiresData: true
      clearWith:
          - vars
          - estimator
          - percentile
          - iterations
          - seed
...
