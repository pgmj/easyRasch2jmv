title: Tree-Based DIF
name: diftree
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Items
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: Covariates
        children:
          - type: VariablesListBox
            name: covariates
            isTarget: true

  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: purification
      - type: CheckBox
        name: pruneNegligible
      - type: CheckBox
        name: showSE

  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: alpha
        format: number
      - type: ComboBox
        name: pAdj
