title: Martin-Löf Test
name: martinlof
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Subscale 1 Items
        children:
          - type: VariablesListBox
            name: subscale1
            isTarget: true
      - type: TargetLayoutBox
        label: Subscale 2 Items
        children:
          - type: VariablesListBox
            name: subscale2
            isTarget: true

  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: iterations
        format: number
      - type: TextBox
        name: seed
        format: number
      - type: CheckBox
        name: sequential

  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: minExpected
        format: number
