---
title: Person Change
name: personchange
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Time 1 Items
        children:
          - type: VariablesListBox
            name: vars1
            isTarget: true
      - type: TargetLayoutBox
        label: Time 2 Items
        children:
          - type: VariablesListBox
            name: vars2
            isTarget: true
      - type: TargetLayoutBox
        label: Respondent ID (optional)
        children:
          - type: VariablesListBox
            name: id
            maxItemCount: 1
            isTarget: true

  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: anchor
      - type: ComboBox
        name: method
      - type: ComboBox
        name: direction
      - type: TextBox
        name: alpha
        format: number

  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: nullType
      - type: TextBox
        name: retestSd
        format: number
        enable: (nullType:retest)

  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: showTable
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: flaggedOnly
      - type: CheckBox
        name: conditionalCrit

  - type: CollapseBox
    label: Retest SD
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: >-
              Valid only when the two occasions are a stability study with no
              expected change.
          - type: Label
            label: >-
              Estimating the retest SD from data in which people really
              changed, then testing that change against it, is circular.
          - type: CheckBox
            name: estimateRetestSd
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: TextBox
                    name: retestIter
                    format: number
                  - type: CheckBox
                    name: retestBoot
                    children:
                      - type: LayoutBox
                        margin: large
                        children:
                          - type: TextBox
                            name: retestBootIter
                            format: number
                  - type: TextBox
                    name: confInt
                    format: number
                    suffix: "%"
                  - type: TextBox
                    name: seed
                    format: number

  - type: CollapseBox
    label: Estimation Range
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: thetaMin
            format: number
          - type: TextBox
            name: thetaMax
            format: number

  - type: CollapseBox
    label: Save to Dataset
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Output
            name: outputThetaT1
          - type: Output
            name: outputThetaT2
          - type: Output
            name: outputChange
          - type: Output
            name: outputSeDiff
          - type: Output
            name: outputRci
          - type: Output
            name: outputPValue
          - type: Output
            name: outputClass
...
