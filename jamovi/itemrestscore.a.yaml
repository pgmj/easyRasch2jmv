---
name: itemrestscore
title: Item-Restscore Correlations
menuGroup: easyRasch2jmv
menuSubgroup: Item fit
version: '1.0.0'
jas: '1.2'

description:
    main: |
        Computes observed and model-expected item-restscore correlations using
        Goodman-Kruskal's gamma, via the easyRasch2 R package
        (iarm::item_restscore() on a conditional maximum likelihood fit from
        psychotools, with WLE person estimates for the relative item
        locations). Reports observed vs. expected restscore correlations, the
        signed difference (observed minus expected; positive =
        over-discrimination / often LD, negative = under-discrimination /
        often noise), BH-adjusted p-values, and item locations. The
        asymptotic p-values are miscalibrated under the Rasch model;
        simulation-based cutoffs replace them with parametric bootstrap
        p-values from easyRasch2::RMitemRestscoreCutoff(). Results match
        easyRasch2::RMitemRestscore().

options:
    - name: data
      type: Data

    - name: vars
      title: Items
      type: Variables
      suggested:
          - continuous
          - ordinal
      permitted:
          - numeric
      rejectInf: true

    - name: computeCutoff
      title: Simulation-based cutoffs
      type: Bool
      default: false

    - name: hdciWidth
      title: HDCI width
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: iterations
      title: Number of simulation iterations
      type: Integer
      default: 400
      min: 50
      max: 5000

    - name: seed
      title: Random seed
      type: Integer
      default: 42

    - name: pValues
      title: Bootstrap p-values
      type: Bool
      default: true

    - name: correction
      title: Multiple-comparison correction
      type: List
      options:
        - name: fwer
          title: Familywise (Westfall-Young)
        - name: fdr_bh
          title: FDR (Benjamini-Hochberg)
        - name: fdr_by
          title: FDR (Benjamini-Yekutieli)
      default: fwer

    - name: sortByDiff
      title: Sorted by absolute difference (largest first)
      type: Bool
      default: false

...
