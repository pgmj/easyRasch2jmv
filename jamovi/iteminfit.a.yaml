---
name: iteminfit
title: Conditional Item Infit
menuGroup: easyRasch2jmv
version: '1.0.0'
jas: '1.2'

description:
    main: |
        Computes conditional infit MSQ statistics for each item using the
        easyRasch2 R package (iarm::out_infit() on a conditional maximum
        likelihood fit via psychotools, with WLE person estimates for the
        relative item locations). Optionally determines simulation-based
        per-item cutoff intervals via parametric bootstrap: datasets are
        simulated under the fitted model (no misfit by construction) and
        the HDCI of each item's simulated infit forms the expected range.
        Items are labelled overfit (infit below the range; more predictable
        than the model expects) or underfit (above; noisier than expected).
        Results match easyRasch2::RMitemInfit(), RMitemInfitCutoff(), and
        RMitemInfitPlot() with the same seed and iterations. Single-core
        sequential processing is used.

        Note on iterations: more simulation iterations are generally
        recommended for publication-ready results. Conditional infit is an
        exception: with small samples, around 100 iterations can yield
        better detection power than a larger number (Johansson, 2025).

        Optionally, bootstrap p-values can be added: each item's observed
        infit is compared against its simulated distribution (Monte-Carlo
        p-value), with correction for multiple comparisons across items --
        Westfall-Young step-down (familywise error rate, the default;
        Ferreira, 2024), Benjamini-Hochberg, or Benjamini-Yekutieli (false
        discovery rate). Flagging is then based on the adjusted p-value
        (< 0.05) instead of the expected range. At least 1000 iterations
        are recommended when reporting p-values. Results match
        easyRasch2::RMitemInfit() with p_value = TRUE.

options:
    - name: data
      type: Data

    - name: vars
      title: Items
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      rejectInf: true

    - name: computeCutoff
      title: Simulation-based cutoffs
      type: Bool
      default: false

    - name: hdciWidth
      title: HDCI width
      type: Number
      default: 99
      min: 50
      max: 99.9

    - name: iterations
      title: Number of simulation iterations
      type: Integer
      default: 250
      min: 50

    - name: seed
      title: Random seed
      type: Integer
      default: 42

    - name: pValues
      title: Bootstrap p-values
      type: Bool
      default: false

    - name: correction
      title: Multiple-comparison correction
      type: List
      options:
        - name: fwer
          title: Familywise (Westfall-Young)
        - name: fdr_bh
          title: FDR (Benjamini-Hochberg)
        - name: fdr_by
          title: FDR (Benjamini-Yekutieli)
      default: fwer

    - name: sortByInfit
      title: Sorted by Infit MSQ (descending)
      type: Bool
      default: false
...
