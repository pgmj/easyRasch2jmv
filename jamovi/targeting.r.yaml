---
name: targeting
title: Targeting Plot
jrs: '1.1'

items:
    - name: targetingPlot
      title: Person-Item Targeting Plot
      type: Image
      refs: [easyRasch2jmv, easyRasch2, wright1979, zeileis2026, warm1989]
      width: 700
      height: 700
      renderFun: .targetingPlot
      requiresData: true
      clearWith:
        - vars
        - robust
        - sortItems
        - bins
        - xlimLow
        - xlimHigh
        - showCi
        - ciLevel

    - name: thresholdTable
      title: Item Threshold Locations
      type: Table
      rows: 0
      clearWith:
        - vars
        - ciLevel
      columns:
        - name: item
          title: Item
          type: text
        - name: threshold
          title: Threshold
          type: text
        - name: location
          title: Location
          type: number
          format: zto
        - name: se
          title: SE
          type: number
          format: zto
        - name: ciLow
          title: Lower
          type: number
          format: zto
          visible: (showCi)
          superTitle: CI
        - name: ciHigh
          title: Upper
          type: number
          format: zto
          visible: (showCi)
          superTitle: CI

    - name: targetingNote
      title: ''
      type: Html
      clearWith:
        - vars
...
