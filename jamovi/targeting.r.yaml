---
name: targeting
title: Targeting Plot
jrs: '1.1'

items:
    - name: targetingPlot
      title: Person-Item Targeting Plot
      type: Image
      refs: [easyRasch2jmv, easyRasch2, wright1979, zeileis2026, warm1989]
      width: 700
      height: 700
      renderFun: .targetingPlot
      requiresData: true
      clearWith:
        - vars
        - robust
        - sortItems
        - bins
        - xlimLow
        - xlimHigh
        - showCi
        - ciLevel

    # Columns are built at run time: the wide (default) layout has one
    # column per threshold, whose count depends on the observed response
    # categories; the long layout adds SE and CI columns.
    - name: thresholdTable
      title: Item Threshold Locations
      type: Table
      rows: 0
      clearWith:
        - vars
        - ciLevel
        - longFormat
      columns: []

    - name: targetingNote
      title: ''
      type: Html
      clearWith:
        - vars
...
