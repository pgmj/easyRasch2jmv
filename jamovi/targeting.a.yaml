---
name: targeting
title: Targeting Plot
menuGroup: easyRasch2jmv
version: '1.0.0'
jas: '1.2'

description:
    main: |
        Person-item targeting plot (Wright map): back-to-back histograms
        of person locations and item threshold locations, plus a dot plot
        of individual item thresholds with optional confidence intervals,
        drawn by the easyRasch2 R package. Item thresholds are estimated
        with CML (psychotools); when any response category has fewer than
        3 observations the analysis falls back to MML (mirt), which is
        more numerically stable under sparse categories. Person locations
        are weighted likelihood estimates (WLE), finite at extreme scores.
        Results are identical to easyRasch2::RMtargeting() and the
        threshold table to easyRasch2::RMitemParameters().

options:
    - name: data
      type: Data

    - name: vars
      title: Items
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      rejectInf: true

    - name: robust
      title: Robust statistics (median/MAD instead of mean/SD)
      type: Bool
      default: false

    - name: sortItems
      title: Item ordering
      type: List
      options:
        - name: data
          title: Data order
        - name: location
          title: Sorted by location
      default: data

    - name: bins
      title: Number of histogram bins
      type: Integer
      default: 15
      min: 5

    - name: xlimLow
      title: X-axis lower limit
      type: Number
      default: -4
      min: -10
      max: 0

    - name: xlimHigh
      title: X-axis upper limit
      type: Number
      default: 4
      min: 0
      max: 10

    - name: showCi
      title: CIs around item threshold locations
      type: Bool
      default: true

    - name: ciLevel
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9
...
