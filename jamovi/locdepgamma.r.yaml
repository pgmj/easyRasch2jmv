---
name: locdepgamma
title: Partial Gamma Local Dependence
jrs: '1.1'

items:
    - name: dir1Table
      title: 'Direction 1: rest score = total − Item 2'
      type: Table
      rows: 0
      refs: [easyRasch2jmv, easyRasch2, christensen2013, johansson2026_cutoffs, mueller2022, kay2025, ferreira2024, westfallyoung1993]
      clearWith:
          - vars
          - nPairs
          - sigOnly
          - gammaThreshold
          - sortByGamma
          - computeCutoff
          - iterations
          - hdciWidth
          - seed
          - pValues
          - correction
      columns:
          - name: item1
            title: Item 1
            type: text
          - name: item2
            title: Item 2
            type: text
          - name: gamma
            title: Partial gamma
            type: number
            format: zto
          - name: se
            title: SE
            type: number
            format: zto
            visible: (showSE)
          - name: lower
            title: Lower
            type: number
            format: zto
            visible: (showSE)
            superTitle: 95% CI
          - name: upper
            title: Upper
            type: number
            format: zto
            visible: (showSE)
            superTitle: 95% CI
          - name: gammaPair
            title: Gamma pair (max)
            type: number
            format: zto
            visible: (computeCutoff)
          - name: padjBH
            title: Adj. p-value (BH)
            type: number
            format: zto,pvalue
            visible: (!(computeCutoff && pValues))
          - name: sig
            title: p-value sign.
            type: text
            visible: (!(computeCutoff && pValues))
          - name: gammaLow
            title: Lower
            type: number
            format: zto
            visible: (computeCutoff)
            superTitle: Expected range
          - name: gammaHigh
            title: Upper
            type: number
            format: zto
            visible: (computeCutoff)
            superTitle: Expected range
          - name: pValue
            title: p-value
            type: number
            format: zto,pvalue
            visible: (computeCutoff && pValues)
          - name: pAdjusted
            title: Adj. p-value
            type: number
            format: zto,pvalue
            visible: (computeCutoff && pValues)
          - name: flagged
            title: Flagged
            type: text
            visible: (computeCutoff)

    - name: dir2Table
      title: 'Direction 2: rest score = total − Item 2'
      type: Table
      rows: 0
      clearWith:
          - vars
          - nPairs
          - sigOnly
          - gammaThreshold
          - sortByGamma
          - computeCutoff
          - iterations
          - hdciWidth
          - seed
          - pValues
          - correction
      columns:
          - name: item1
            title: Item 1
            type: text
          - name: item2
            title: Item 2
            type: text
          - name: gamma
            title: Partial gamma
            type: number
            format: zto
          - name: se
            title: SE
            type: number
            format: zto
            visible: (showSE)
          - name: lower
            title: Lower
            type: number
            format: zto
            visible: (showSE)
            superTitle: 95% CI
          - name: upper
            title: Upper
            type: number
            format: zto
            visible: (showSE)
            superTitle: 95% CI
          - name: gammaPair
            title: Gamma pair (max)
            type: number
            format: zto
            visible: (computeCutoff)
          - name: padjBH
            title: Adj. p-value (BH)
            type: number
            format: zto,pvalue
            visible: (!(computeCutoff && pValues))
          - name: sig
            title: p-value sign.
            type: text
            visible: (!(computeCutoff && pValues))
          - name: gammaLow
            title: Lower
            type: number
            format: zto
            visible: (computeCutoff)
            superTitle: Expected range
          - name: gammaHigh
            title: Upper
            type: number
            format: zto
            visible: (computeCutoff)
            superTitle: Expected range
          - name: pValue
            title: p-value
            type: number
            format: zto,pvalue
            visible: (computeCutoff && pValues)
          - name: pAdjusted
            title: Adj. p-value
            type: number
            format: zto,pvalue
            visible: (computeCutoff && pValues)
          - name: flagged
            title: Flagged
            type: text
            visible: (computeCutoff)

    - name: ldPlot
      title: Simulated Partial Gamma Distribution per Item Pair
      type: Image
      width: 500
      height: 600
      renderFun: .ldPlot
      visible: (computeCutoff)
      requiresData: true
      clearWith:
          - vars
          - computeCutoff
          - iterations
          - seed
          - plotPairs

    # Hidden state carrier: caches the cutoff simulation so option changes
    # that do not affect it (filters, sorting, plotPairs, showSE) reuse the
    # simulated distributions instead of rerunning them. Never displayed.
    - name: simCache
      title: ''
      type: Html
      visible: false
      clearWith:
          - vars
          - computeCutoff
          - iterations
          - hdciWidth
          - seed

    - name: ldNote
      title: ''
      type: Html
      clearWith:
          - vars
          - nPairs
          - sigOnly
          - gammaThreshold
          - sortByGamma
          - computeCutoff
          - iterations
          - hdciWidth
          - seed
          - pValues
          - correction
          - showSE
...
