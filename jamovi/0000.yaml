---
name: easyRasch2jmv
title: easyRasch2 for Jamovi
version: 3.0.0
jms: '1.0'
authors:
  - Magnus Johansson
maintainer: Magnus Johansson <pgmj@pm.me>
date: '2026-07-06'
type: R
description: >
  Provides Rasch analysis functions for jamovi. All analyses delegate their
  computations to the easyRasch2 R package (conditional maximum likelihood
  estimation via psychotools with Warm's weighted likelihood person estimates;
  iarm for the conditional item-fit and partial-gamma statistics; eRm for
  Andersen's LR test; lavaan for the CFA checks), so results are numerically
  identical to easyRasch2 with the same seeds and iterations.
analyses:
  - title: Conditional Item Infit
    name: iteminfit
    ns: easyRasch2jmv
    menuGroup: easyRasch2jmv
    menuTitle: Conditional Item Infit
    category: analyses
    description: |-
      Computes conditional infit MSQ statistics for each item using the
      easyRasch2 R package (iarm::out_infit() on a conditional maximum
      likelihood fit via psychotools, with WLE person estimates for the
      relative item locations). Optionally determines simulation-based
      per-item cutoff intervals via parametric bootstrap: datasets are
      simulated under the fitted model (no misfit by construction) and
      the HDCI of each item's simulated infit forms the expected range.
      Items are labelled overfit (infit below the range; more predictable
      than the model expects) or underfit (above; noisier than expected).
      Results match easyRasch2::RMitemInfit(), RMitemInfitCutoff(), and
      RMitemInfitPlot() with the same seed and iterations. Single-core
      sequential processing is used.
  - title: Item-Restscore Correlations
    name: itemrestscore
    ns: easyRasch2jmv
    menuGroup: easyRasch2jmv
    menuTitle: Item-Restscore Correlations
    category: analyses
    description: |
      Computes observed and model-expected item-restscore correlations using
      Goodman-Kruskal's gamma, via the easyRasch2 R package
      (iarm::item_restscore() on a conditional maximum likelihood fit from
      psychotools, with WLE person estimates for the relative item
      locations). Reports observed vs. expected restscore correlations, the
      signed difference (observed minus expected; positive =
      over-discrimination / often LD, negative = under-discrimination /
      often noise), BH-adjusted p-values, and item locations. Results match
      easyRasch2::RMitemRestscore().
  - title: Bootstrap Item-Restscore
    name: bootrestscore
    ns: easyRasch2jmv
    menuGroup: easyRasch2jmv
    menuTitle: Bootstrap Item-Restscore
    category: analyses
    description: |
      Non-parametric bootstrap of item-restscore fit via the easyRasch2 R
      package (RMitemRestscoreBoot). For each iteration a sample of size
      `samplesize` is drawn from the data with replacement, the Rasch /
      Partial Credit model is refitted by conditional maximum likelihood
      (psychotools::pcmodel), and items are classified as overfit,
      underfit, or no misfit based on the BH-adjusted p-value (< .05) from
      iarm::item_restscore() and the sign of (observed - expected). Useful
      with large samples where the asymptotic test can flag items that are
      not practically misfitting. The bootstrap is numerically identical
      to easyRasch2::RMitemRestscoreBoot() with the same seed and
      iterations. Single-core sequential processing is used.
  - title: Conditional Item Infit (Multiple Imputation)
    name: iteminfitmi
    ns: easyRasch2jmv
    category: analyses
    menuGroup: easyRasch2jmv
    menuTitle: Conditional Item Infit (Multiple Imputation)
    description: |-
      Computes pooled conditional infit MSQ statistics for items with missing
      responses. Internally runs mice::mice() to generate `m` imputed
      datasets, then delegates the per-imputation model fitting (conditional
      maximum likelihood via psychotools, with WLE person estimates),
      conditional infit computation (iarm::out_infit()), and Rubin's-rules
      pooling to easyRasch2::RMitemInfitMI(). Results match RMitemInfitMI()
      and RMitemInfitCutoffMI() run on the same imputed datasets and seed.
  - title: Dynamic CFA Fit-Index Cutoffs
    name: cfacutoff
    ns: easyRasch2jmv
    menuGroup: easyRasch2jmv
    menuTitle: Dynamic CFA Fit-Index Cutoffs
    category: analyses
    description: |-
      Tests whether the observed one-factor categorical-CFA fit indices
      (CFI, RMSEA, SRMR) are consistent with the data being generated by a
      unidimensional Rasch / Partial Credit Model, via the easyRasch2 R
      package (results are identical to easyRasch2::RMdimCFACutoff() and
      RMdimCFA() with the same seed). Datasets are simulated under the
      fitted model (psychotools CML with WLE person estimates), refitted
      with lavaan (ordered = TRUE), and the observed indices are compared
      to percentile cutoffs from the simulated null distribution. Also
      reports each item's observed standardized loading against its
      simulated expected range, with figures for both views.
  - title: PCA of Standardized Rasch Residuals
    name: residualpca
    ns: easyRasch2jmv
    category: analyses
    menuGroup: easyRasch2jmv
    menuTitle: PCA of Standardized Rasch Residuals
    description: |-
      Fits a Rasch / partial credit model and runs an unrotated
      principal-component analysis on the standardized residuals, computed
      by the easyRasch2 R package (CML item parameters via psychotools,
      WLE person estimates; results are identical to
      easyRasch2::RMdimResidualPCA()). Reports the largest eigenvalues,
      the variance partition (explained by measures vs unexplained), and a
      PC1-loadings-vs-location plot for inspecting the first residual
      contrast. Optionally determines a simulation-based cutoff for the
      first eigenvalue via parametric bootstrap
      (easyRasch2::RMdimResidualPCACutoff(); Chou & Wang, 2010).
  - title: Martin-Löf Test
    name: martinlof
    ns: easyRasch2jmv
    category: analyses
    menuGroup: easyRasch2jmv
    menuTitle: Martin-Löf Test
    description: |-
      Martin-Löf likelihood-ratio test of unidimensionality against an
      a priori partition of the items into two subscales, generalised
      to polytomous Rasch / partial credit models (Christensen,
      Bjorner, Kreiner & Petersen, 2002), computed by the easyRasch2 R
      package (RMdimMartinLof()). The p-value is obtained by Monte
      Carlo simulation under the unidimensional null model (Christensen
      & Kreiner, 2007), because the asymptotic chi-square approximation
      is biased toward conservatism at realistic sample sizes,
      especially with polytomous items.
  - title: Partial Gamma Local Dependence
    name: locdepgamma
    ns: easyRasch2jmv
    menuGroup: easyRasch2jmv
    menuTitle: Partial Gamma Local Dependence
    category: analyses
    description: |
      Computes partial gamma coefficients for Local Dependence (LD)
      assessment via the easyRasch2 R package (iarm::partgam_LD()). Each
      pair of items is tested for residual association, controlling for
      the rest score (total score minus one of the items in the pair).
      Because it matters which item of a pair is subtracted from the
      total score, each pair is tested in both rest-score directions
      (two tables). Optionally determines simulation-based per-pair
      expected ranges via parametric bootstrap (data simulated from the
      fitted model contain no true LD), with a plot of the simulated
      distributions and observed values. Results are identical to
      easyRasch2::RMlocdepGamma(), RMlocdepGammaCutoff(), and
      RMlocdepGammaPlot() with the same seed and iterations. Single-core
      sequential processing is used.
  - title: Q3 Residual Correlation Matrix
    name: locdepq3
    ns: easyRasch2jmv
    menuGroup: easyRasch2jmv
    menuTitle: Q3 Residual Correlation Matrix
    category: analyses
    description: |-
      Computes Yen's Q3 residual correlations between item pairs for local
      dependence assessment in Rasch models, using the easyRasch2 R package:
      item parameters are estimated by conditional maximum likelihood (CML,
      via psychotools) and person locations by Warm's weighted likelihood
      (WLE). Optionally runs a parametric bootstrap simulation to determine
      simulation-based cutoff values -- a global cutoff applied to the Q3
      matrix and per-pair expected ranges -- along with a Q3 heatmap and a
      per-pair distribution plot. Results match easyRasch2::RMlocdepQ3(),
      RMlocdepQ3Cutoff(), and RMlocdepQ3Plot() with the same seed and
      iterations. Single-core sequential processing is used.
  - title: Andersen LR-test DIF
    name: lrdif
    ns: easyRasch2jmv
    menuGroup: easyRasch2jmv
    menuTitle: Andersen LR-test DIF
    category: analyses
    description: |-
      Splits a Rasch / Partial Credit model by an external categorical
      grouping variable using Andersen's likelihood-ratio test
      (eRm::LRtest(), via the easyRasch2 R package) and reports per-group
      item locations (or per-group threshold locations) together with
      their standard errors, a MaxDiff column (largest between-group
      location difference), and an optional per-group locations figure.
      Results are identical to easyRasch2::RMdifLR(). A
      response-distribution tileplot (easyRasch2::RMplotTile()) is
      available for inspecting per-group category counts.
  - title: Tree-Based DIF
    name: diftree
    ns: easyRasch2jmv
    category: analyses
    menuGroup: easyRasch2jmv
    menuTitle: Tree-Based DIF
    description: |-
      Tree-based Differential Item Functioning (DIF) analysis via the
      easyRasch2 R package (RMdifTree(), building on
      psychotree::raschtree() / pctree()): the sample is recursively
      split on one or more covariates wherever the item parameters are
      unstable, so DIF is detected without pre-specifying groups.
      Unlike the other DIF analyses in this module, several covariates
      can be examined at once, continuous covariates (e.g. age) are
      handled natively (the algorithm finds the optimal cutpoint), and
      interactions emerge as nested splits.
  - title: Partial Gamma DIF
    name: partgamdif
    ns: easyRasch2jmv
    menuGroup: easyRasch2jmv
    menuTitle: Partial Gamma DIF
    category: analyses
    description: |-
      Computes partial gamma coefficients for Differential Item
      Functioning (DIF) via the easyRasch2 R package
      (iarm::partgam_DIF()): the association between each item and the
      DIF variable, controlling for the rest score. Optionally
      determines simulation-based expected ranges via parametric
      bootstrap (data are simulated from the fitted model and the DIF
      variable is randomly reassigned with preserved group proportions,
      so the simulated data contain no true DIF). Results are identical
      to easyRasch2::RMdifGamma() and RMdifGammaCutoff() with the same
      seed and iterations. A response-distribution tileplot
      (easyRasch2::RMplotTile()) is available for inspecting per-group
      category counts. Single-core sequential processing is used.
  - title: Item Characteristic Curves (CICC)
    name: cicc
    ns: easyRasch2jmv
    category: analyses
    menuGroup: easyRasch2jmv
    menuTitle: Item Characteristic Curves (CICC)
    description: |-
      Conditional item characteristic curves (Buchardt, Christensen &
      Jensen, 2023): the model-expected item score as a function of the
      total score (the exact conditional expectation), with observed mean
      item scores overlaid per total-score group. Groups are formed on
      the total-score scale -- quantile-based (approximately equal
      numbers of respondents), equal-width score intervals, or one group
      per total score -- and observed means that deviate from the
      expected curve indicate localized item misfit. Drawn by
      easyRasch2::RMitemICCPlot() (CML item estimation via psychotools).
  - title: Item Probability Curves
    name: iccplot
    ns: easyRasch2jmv
    menuGroup: easyRasch2jmv
    menuTitle: Item Probability Curves
    category: analyses
    description: |
      Plots model-implied response probabilities as a function of the
      latent trait, computed by the easyRasch2 R package (CML estimation
      via psychotools; a dichotomous item is a 2-category partial credit
      model). Dichotomous data are shown as joint item characteristic
      curves (all items in one panel, one curve per item, cf.
      eRm::plotjointICC); polytomous data as category probability curves
      with one facet per item, drawn by easyRasch2::RMitemCatProb().
      Probabilities are identical to RMitemCatProb().
  - title: Targeting Plot
    name: targeting
    ns: easyRasch2jmv
    menuGroup: easyRasch2jmv
    menuTitle: Targeting Plot
    category: analyses
    description: |
      Person-item targeting plot (Wright map): back-to-back histograms
      of person locations and item threshold locations, plus a dot plot
      of individual item thresholds with optional confidence intervals,
      drawn by the easyRasch2 R package. Item thresholds are estimated
      with CML (psychotools); when any response category has fewer than
      3 observations the analysis falls back to MML (mirt), which is
      more numerically stable under sparse categories. Person locations
      are weighted likelihood estimates (WLE), finite at extreme scores.
      Results are identical to easyRasch2::RMtargeting() and the
      threshold table to easyRasch2::RMitemParameters().
  - title: Reliability
    name: reliability
    ns: easyRasch2jmv
    menuGroup: easyRasch2jmv
    menuTitle: Reliability
    category: analyses
    description: |-
      Reports four reliability indices for a Rasch / partial credit model,
      computed by the easyRasch2 R package (results are identical to
      easyRasch2::RMreliability()): Cronbach's alpha (closed-form), the
      WLE-based Person Separation Index (PSI; CML item parameters via
      psychotools, min/max scorers excluded), the marginal reliability
      (Green, 1984; CML test information integrated over the estimated
      latent distribution), and Relative Measurement Uncertainty (RMU)
      computed from mirt plausible values using the Bignardi, Kievit &
      Bürkner (2025) split-half correlation method. A large gap between
      PSI and Marginal suggests the sample is off-target relative to the
      scale.
  - title: Person Parameters
    name: personparams
    ns: easyRasch2jmv
    category: analyses
    menuGroup: easyRasch2jmv
    menuTitle: Person Parameters
    description: |-
      Estimates a location on the latent variable (theta, in logits) for
      each respondent, with its standard error of measurement (SEM),
      using the easyRasch2 R package (RMpersonParameters()): item
      parameters are estimated once by conditional maximum likelihood
      (CML, via psychotools) and treated as fixed; each person's theta
      is then estimated from the items they answered, so respondents
      with partially missing responses are retained. Results are
      identical to easyRasch2::RMpersonParameters().
  - title: Person Fit
    name: personfit
    ns: easyRasch2jmv
    category: analyses
    menuGroup: easyRasch2jmv
    menuTitle: Person Fit
    description: |-
      Computes per-respondent person-fit statistics with Monte-Carlo
      resampled p-values, using the easyRasch2 R package
      (RMpersonFit()): conditional infit and outfit mean-squares (MSQ;
      computed conditional on the total score, so no biased person
      estimate enters, and partial missingness is handled directly) and
      the standardized log-likelihood statistic lz. Significance is
      assessed by resampling under the fitted model rather than by the
      unreliable asymptotic null distributions: the MSQ statistics are
      referenced against patterns sampled conditional on the person's
      total score, and lz against patterns simulated at the estimated
      location with the location re-estimated per pattern. Results are
      identical to easyRasch2::RMpersonFit() with the same seed and
      iterations. Single-core sequential processing is used.
datasets:
  - name: pcmdat2
    path: eRm_pcmdat2.csv
    description: Polytomous dataset from eRm
  - name: raschdat3
    path: eRm_raschdat3.csv
    description: Dichotomous dataset from eRm
  - name: pcmdat2dif
    path: eRm_pcmdat2dif.csv
    description: Polytomous dataset from eRm with added DIF variable
usesNative: false
minApp: 1.0.8

...
