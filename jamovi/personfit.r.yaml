---
name: personfit
title: Person Fit
jrs: '1.1'

items:
    - name: summaryTable
      title: Person Fit Summary
      type: Table
      rows: 0
      refs: [easyRasch2jmv, easyRasch2, mueller2020, sinharay2016, kreiner2011, zeileis2026, warm1989]
      clearWith: &computeOpts
          - vars
          - statInfit
          - statOutfit
          - statLz
          - flagDirection
          - flagAlpha
          - iterations
          - seed
      columns:
          - name: statistic
            title: Statistic
            type: text
          - name: value
            title: Value
            type: number
            format: zto

    - name: personfitNote
      title: ''
      type: Html
      clearWith: *computeOpts

    - name: infitPlot
      title: Person Infit Map
      type: Image
      width: 550
      height: 450
      renderFun: .infitMap
      visible: (statInfit)
      requiresData: true
      clearWith: *computeOpts

    - name: outfitPlot
      title: Person Outfit Map
      type: Image
      width: 550
      height: 450
      renderFun: .outfitMap
      visible: (statOutfit)
      requiresData: true
      clearWith: *computeOpts

    - name: lzPlot
      title: Person lz Map
      type: Image
      width: 550
      height: 450
      renderFun: .lzMap
      visible: (statLz)
      requiresData: true
      clearWith: *computeOpts

    # Hidden state carrier: caches the resampling results (fit dataframe +
    # the person-fit maps, from one RMpersonFit(output = "list") call) so
    # output-variable toggles reuse them instead of rerunning. The three
    # figures read their plots from here. Never displayed.
    - name: simCache
      title: ''
      type: Html
      visible: false
      clearWith: *computeOpts

    # Output variables written into the dataset (paired with the a.yaml
    # Output options of the same names).
    - name: outputFlagged
      title: Flagged (any statistic)
      type: Output
      varTitle: pfit_flagged
      varDescription: >
        1 when any requested person-fit statistic has an uncorrected
        resampled p-value below the flagging alpha (per-person screening
        flag), 0 otherwise; empty for extreme scorers, who cannot be
        assessed. From the easyRasch2jmv Person Fit analysis.
      measureType: nominal
      clearWith: *computeOpts

    - name: outputInfit
      title: Infit MSQ
      type: Output
      varTitle: pfit_infit
      varDescription: >
        Conditional person infit MSQ, from the easyRasch2jmv Person Fit
        analysis.
      measureType: continuous
      clearWith: *computeOpts

    - name: outputOutfit
      title: Outfit MSQ
      type: Output
      varTitle: pfit_outfit
      varDescription: >
        Conditional person outfit MSQ, from the easyRasch2jmv Person Fit
        analysis.
      measureType: continuous
      clearWith: *computeOpts

    - name: outputLz
      title: lz
      type: Output
      varTitle: pfit_lz
      varDescription: >
        Standardized log-likelihood person-fit statistic (lz), from the
        easyRasch2jmv Person Fit analysis.
      measureType: continuous
      clearWith: *computeOpts

    - name: outputPInfit
      title: p-value (infit)
      type: Output
      varTitle: pfit_p_infit
      varDescription: >
        Resampled p-value of the person infit MSQ, from the easyRasch2jmv
        Person Fit analysis.
      measureType: continuous
      clearWith: *computeOpts

    - name: outputPOutfit
      title: p-value (outfit)
      type: Output
      varTitle: pfit_p_outfit
      varDescription: >
        Resampled p-value of the person outfit MSQ, from the easyRasch2jmv
        Person Fit analysis.
      measureType: continuous
      clearWith: *computeOpts

    - name: outputPLz
      title: p-value (lz)
      type: Output
      varTitle: pfit_p_lz
      varDescription: >
        Resampled p-value of the person lz statistic, from the
        easyRasch2jmv Person Fit analysis.
      measureType: continuous
      clearWith: *computeOpts
...
