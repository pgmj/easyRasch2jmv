---
name: partgamdif
title: Partial Gamma DIF
menuGroup: easyRasch2jmv
menuSubgroup: DIF
version: '1.0.0'
jas: '1.2'

description:
    main: |
        Computes partial gamma coefficients for Differential Item
        Functioning (DIF) via the easyRasch2 R package
        (iarm::partgam_DIF()): the association between each item and the
        DIF variable, controlling for the total score. Optionally
        determines simulation-based expected ranges and bootstrap p-values
        with a multiple-comparison correction. Each simulated dataset keeps
        every respondent's group and total score and redraws their
        response pattern from the fitted Rasch model given that score, so
        it contains no DIF. Results are identical to
        easyRasch2::RMdifGamma() and RMdifGammaCutoff() with the same seed
        and iterations. A response-distribution tileplot
        (easyRasch2::RMplotTile()) is available for inspecting per-group
        category counts. Single-core sequential processing is used.

        More simulation iterations are generally recommended for
        publication-ready results.

options:
    - name: data
      type: Data

    - name: vars
      title: Items
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      rejectInf: true

    - name: difVar
      title: DIF Variable
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor

    - name: computeCutoff
      title: Simulation-based cutoffs
      type: Bool
      default: false

    - name: hdciWidth
      title: HDCI width
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: iterations
      title: Number of simulation iterations
      type: Integer
      default: 400
      min: 50
      max: 5000

    - name: seed
      title: Random seed
      type: Integer
      default: 42

    - name: pValues
      title: Bootstrap p-values
      type: Bool
      default: true

    - name: correction
      title: Multiple-comparison correction
      type: List
      options:
        - name: fwer
          title: Familywise (Westfall-Young)
        - name: fdr_bh
          title: FDR (Benjamini-Hochberg)
        - name: fdr_by
          title: FDR (Benjamini-Yekutieli)
      default: fwer

    - name: sortByGamma
      title: Sorted by |Partial gamma| (descending)
      type: Bool
      default: false

    - name: showSE
      title: SE and 95% confidence interval
      type: Bool
      default: false

    - name: showTileplot
      title: Response distribution by DIF group
      type: Bool
      default: false

    - name: tileCutoff
      title: Highlight cells with count below
      type: Integer
      default: 10
      min: 1

    - name: tilePercent
      title: Percentages (instead of counts)
      type: Bool
      default: false
...
