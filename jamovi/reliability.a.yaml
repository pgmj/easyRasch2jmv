---
name: reliability
title: Reliability
menuGroup: easyRasch2jmv
menuSubgroup: Person-level
version: '1.0.0'
jas: '1.2'

description:
    main: |
        Reports four reliability indices for a Rasch / partial credit model,
        computed by the easyRasch2 R package (results are identical to
        easyRasch2::RMreliability()): Cronbach's alpha (closed-form), the
        WLE-based Person Separation Index (PSI; CML item parameters via
        psychotools, min/max scorers excluded), the marginal reliability,
        and Relative Measurement Uncertainty (RMU) computed from mirt
        plausible values using the Bignardi, Kievit & Bürkner (2025)
        split-half correlation method. A large gap between PSI and
        Marginal suggests the sample is off-target relative to the scale.

        Marginal reliability is the latent-density-weighted mean of the
        conditional reliability, sigma^2 / (sigma^2 + SEM(theta)^2), which
        is what the reliability curve below averages. Before module
        version 3.2.0 it was Green's (1984) subtractive coefficient, which
        could fall below zero and was floored there. Values are now
        higher, more so on short scales.

        A non-parametric bootstrap can optionally be enabled: respondents
        are resampled and Cronbach's alpha, PSI, and Marginal reliability
        are recomputed natively per resample to yield HDCIs (no model
        refitting via mirt is involved, so it is fast enough for the jamovi
        UI). The RMU interval is always reported.

        A conditional-precision curve can also be shown
        (easyRasch2::RMreliabilityCurve()): the standard error of
        measurement, the test information, or the conditional reliability
        across the latent scale, with the respondent distribution behind
        it. Where a single coefficient reports one number for the whole
        scale, the curve shows how precision varies with a respondent's
        location, and a benchmark can shade the region reaching a given
        reliability and report the share of respondents inside it.

options:
    - name: data
      type: Data

    - name: vars
      title: Items
      type: Variables
      suggested:
          - continuous
          - ordinal
      permitted:
          - numeric
      rejectInf: true

    - name: estim
      title: Theta estimator (RMU)
      type: List
      options:
          - title: Weighted Likelihood (WLE)
            name: WLE
          - title: Expected A Posteriori (EAP)
            name: EAP
          - title: Maximum A Posteriori (MAP)
            name: MAP
          - title: Maximum Likelihood (ML)
            name: ML
      default: WLE

    - name: draws
      title: Plausible-value draws (RMU)
      type: Integer
      default: 1000
      min: 100
      max: 10000

    - name: rmuIter
      title: RMU iterations
      type: Integer
      default: 50
      min: 5
      max: 500

    - name: confInt
      title: HDCI width
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: thetaMin
      title: Theta range (lower)
      type: Number
      default: -10
      min: -20
      max: 0

    - name: thetaMax
      title: Theta range (upper)
      type: Number
      default: 10
      min: 0
      max: 20

    - name: bootAlpha
      title: Bootstrap CIs (alpha, PSI, Marginal)
      type: Bool
      default: false

    - name: bootIter
      title: Bootstrap iterations
      type: Integer
      default: 200
      min: 100
      max: 5000

    - name: seed
      title: Random seed
      type: Integer
      default: 42

    - name: showCurve
      title: Conditional precision curve
      type: Bool
      default: false

    - name: curveStatistic
      title: Curve statistic
      type: List
      options:
          - name: sem
            title: Standard error of measurement
          - name: reliability
            title: Conditional reliability
          - name: information
            title: Test information
      default: sem

    - name: curveReference
      title: Draw the flat marginal summary as a reference line
      type: Bool
      default: true

    - name: showDensity
      title: Show the respondent distribution behind the curve
      type: Bool
      default: true

    - name: useBenchmark
      title: Shade the region reaching a reliability benchmark
      type: Bool
      default: false

    - name: benchmark
      title: Reliability benchmark
      type: Number
      default: 0.8
      min: 0.5
      max: 0.99

    - name: curveBoot
      title: Bootstrap confidence band
      type: Bool
      default: false

    - name: curveBootIter
      title: Band bootstrap iterations
      type: Integer
      default: 200
      min: 50
      max: 2000

    - name: nNodes
      title: Points on the theta grid
      type: Integer
      default: 161
      min: 51
      max: 501

...
