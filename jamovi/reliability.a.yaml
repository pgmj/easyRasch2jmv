---
name: reliability
title: Reliability
menuGroup: easyRasch2jmv
menuSubgroup: Person-level
version: '1.0.0'
jas: '1.2'

description:
    main: |
        Reports four reliability indices for a Rasch / partial credit model,
        computed by the easyRasch2 R package (results are identical to
        easyRasch2::RMreliability()): Cronbach's alpha (closed-form), the
        WLE-based Person Separation Index (PSI; CML item parameters via
        psychotools, min/max scorers excluded), the marginal reliability
        (Green, 1984; CML test information integrated over the estimated
        latent distribution), and Relative Measurement Uncertainty (RMU)
        computed from mirt plausible values using the Bignardi, Kievit &
        Bürkner (2025) split-half correlation method. A large gap between
        PSI and Marginal suggests the sample is off-target relative to the
        scale.

        A non-parametric bootstrap can optionally be enabled: respondents
        are resampled and Cronbach's alpha, PSI, and Marginal reliability
        are recomputed natively per resample to yield HDCIs (no model
        refitting via mirt is involved, so it is fast enough for the jamovi
        UI). The RMU interval is always reported.

options:
    - name: data
      type: Data

    - name: vars
      title: Items
      type: Variables
      suggested:
          - continuous
          - ordinal
      permitted:
          - numeric
      rejectInf: true

    - name: estim
      title: Theta estimator (RMU)
      type: List
      options:
          - title: Weighted Likelihood (WLE)
            name: WLE
          - title: Expected A Posteriori (EAP)
            name: EAP
          - title: Maximum A Posteriori (MAP)
            name: MAP
          - title: Maximum Likelihood (ML)
            name: ML
      default: WLE

    - name: draws
      title: Plausible-value draws (RMU)
      type: Integer
      default: 1000
      min: 100
      max: 10000

    - name: rmuIter
      title: RMU iterations
      type: Integer
      default: 50
      min: 5
      max: 500

    - name: confInt
      title: HDCI width
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: thetaMin
      title: Theta range (lower)
      type: Number
      default: -10
      min: -20
      max: 0

    - name: thetaMax
      title: Theta range (upper)
      type: Number
      default: 10
      min: 0
      max: 20

    - name: bootAlpha
      title: Bootstrap CIs (alpha, PSI, Marginal)
      type: Bool
      default: false

    - name: bootIter
      title: Bootstrap iterations
      type: Integer
      default: 1000
      min: 100
      max: 5000

    - name: seed
      title: Random seed
      type: Integer
      default: 42

...
